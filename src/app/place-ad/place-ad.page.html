<ion-header>
  <ion-toolbar>
    <ion-button class="bgnone">
      <ion-back-button></ion-back-button>
    </ion-button>
    <ion-title class="ion-text-center">Place an ad</ion-title>
    <ion-button slot="end" class="bgnone">
      <ion-icon name="close-circle" slot="end" size="medium" style="color: black;"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h5 class="ion-text-center">You're almost there!</h5>
  <p class="ion-text-center">Include as much details and pictures as possible!</p>

  <form [formGroup]="adForm" (ngSubmit)="onSubmit()">

    <!-- Location Input -->
    <ion-card>
      <ion-item>
        <ion-input formControlName="location" label="Location" labelPlacement="floating" placeholder="Select location"></ion-input>
        <ion-icon slot="end" name="location-outline" color="medium"></ion-icon>
      </ion-item>
    </ion-card>

    <!-- Mobile Type -->
    <ion-card>
      <ion-item>
        <ion-select formControlName="mobileType" label="Mobile Type" placeholder="Select mobile type">
          <ion-select-option value="phone">Phone</ion-select-option>
          <ion-select-option value="tablet">Tablet</ion-select-option>
          <ion-select-option value="desktop">Desktop</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-card>

    <!-- Brand -->
    <ion-card>
      <ion-item>
        <ion-select formControlName="brand" label="Brand" placeholder="Select brand">
          <ion-select-option value="Apple">Apple</ion-select-option>
          <ion-select-option value="Samsung">Samsung</ion-select-option>
          <ion-select-option value="Vivo">Vivo</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-card>

    <!-- Add Title -->
    <ion-card>
      <ion-item>
        <ion-input formControlName="title" label="Add Title" labelPlacement="floating" placeholder="Enter title"></ion-input>
      </ion-item>
    </ion-card>

    <!-- Description -->
    <ion-card>
      <ion-item>
        <ion-textarea formControlName="description" label="Describe" labelPlacement="floating" placeholder="Additional Info..."></ion-textarea>
      </ion-item>
    </ion-card>

    <!-- Add Pictures -->
    <ion-card>
      <ion-item lines="none">
        <input type="file" (change)="onImageSelected($event)" />
      </ion-item>
    </ion-card>

    <!-- Price -->
    <ion-card>
      <ion-item>
        <ion-input formControlName="price" label="Price" labelPlacement="floating" placeholder="Enter price"></ion-input>
      </ion-item>
    </ion-card>

    <ion-button type="submit" expand="block" size="large" class="nxtbtn">Next</ion-button>

  </form>
</ion-content>
